services:
  - type: keyvalue
    name: aliver-uz-redis-stage
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: aliver-uz-api-stage
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run db:generate && npm run -w @aliver/api build
    # Seed idempotent: mavjud yozuvlarni takrorlamaydi, superadmin parolini esa
    # SEED_SUPERADMIN_PASSWORD qiymatiga moslaydi. Bu oldin seed qilinmagan
    # associated staging bazada ham admin loginini yaratadi.
    startCommand: npm run -w @aliver/api prisma:deploy && npm run db:seed && npm run -w @aliver/api start
    healthCheckPath: /api/health
    initialDeployHook: npm run db:seed && npm run migrate:aliver-catalog -- --commit --usd-to-uzs=11783.47
    envVars:
      - key: NODE_ENV
        value: development
      - key: APP_ENV
        value: development
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: aliver-uz-db-stage
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aliver-uz-redis-stage
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://aliver-uz-web-stage.onrender.com,https://aliver-uz-admin-stage.onrender.com
      - key: WEB_URL
        value: https://aliver-uz-web-stage.onrender.com
      - key: ADMIN_URL
        value: https://aliver-uz-admin-stage.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      # Admin va web API ga O'Z DOMENIDAGI /api proxy orqali murojaat
      # qiladi, ya'ni so'rov cross-site emas va `lax` yetarli.
      - key: COOKIE_SAMESITE
        value: lax
      # Domen ATAYLAB bo'sh: host-only cookie. `.onrender.com` Public
      # Suffix List da — u bilan umumiy cookie qo'yib bo'lmaydi.
      - key: COOKIE_DOMAIN
        value: ""
      # Render reverse proxy orqasida ishlaydi. Bunsiz `req.ip` hamma
      # uchun bir xil bo'lib, chastota cheklovlari butun saytni bloklaydi.
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENTS_MODE
        value: mock
      - key: OFD_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: console
      - key: SEED_DEMO_CATALOG
        value: "false"
      - key: ALIVER_WAREHOUSE_CODE
        value: MAIN
      - key: SEED_SUPERADMIN_EMAIL
        value: admin@aliver.uz
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false

  - type: web
    name: aliver-uz-web-stage
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run -w @aliver/web build
    startCommand: npm run -w @aliver/web start
    # Bosh sahifa katalog API sini chaqiradi. API uyg'onayotgan paytda Web
    # health-check yiqilmasligi uchun statik endpoint ishlatiladi.
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_ENV
        value: production
      # Brauzer API ga to'g'ridan-to'g'ri bormaydi — u o'z domenidagi
      # /api ga so'rov yuboradi, Next.js esa uni serverda uzatadi.
      # `API_ORIGIN` server o'zgaruvchisi: brauzer paketiga tushmaydi.
      - key: API_ORIGIN
        value: https://aliver-uz-api-stage.onrender.com

  - type: web
    name: aliver-uz-admin-stage
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run -w @aliver/admin build
    startCommand: npm run -w @aliver/admin start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      # Login cookie'si aynan shu tufayli ishlaydi: so'rov admin
      # domenida qoladi va cookie birinchi tomon cookie si bo'ladi.
      - key: API_ORIGIN
        value: https://aliver-uz-api-stage.onrender.com

databases:
  - name: aliver-uz-db-stage
    plan: free
    region: frankfurt
    databaseName: aliver_stage
    user: aliver_stage
