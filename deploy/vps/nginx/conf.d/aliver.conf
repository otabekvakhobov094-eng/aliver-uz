# ALIVER.UZ — nginx (TLS bilan).
#
# Ikki domen: do'kon va admin panel. Ikkalasida ham `/api/` shu
# serverdagi API ga uzatiladi — bu ATAYLAB shunday: brauzer uchun
# so'rov o'z domenida qoladi va autentifikatsiya cookie'si birinchi
# tomon cookie'si bo'ladi. Alohida `api.` subdomeni ishlatilsa,
# cookie cross-site bo'lib, Safari uni bloklaydi.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

upstream api_upstream   { server api:4000;   keepalive 32; }
upstream web_upstream   { server web:3000;   keepalive 32; }
upstream admin_upstream { server admin:3001; keepalive 32; }

# Umumiy proxy sarlavhalari.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";

# ------------------------------ HTTP -> HTTPS ------------------------------
server {
  listen 80;
  server_name ALIVER_DOMAIN www.ALIVER_DOMAIN ALIVER_ADMIN_DOMAIN;

  # Sertifikat yangilanishi HTTPS ga yo'naltirilmasligi kerak.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / { return 301 https://$host$request_uri; }
}

# --------------------------------- Do'kon ---------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name ALIVER_DOMAIN www.ALIVER_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/ALIVER_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ALIVER_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Brauzer bu domenga faqat HTTPS orqali kirishini eslab qoladi.
  # DIQQAT: sayt to'liq ishlaganiga ishonch hosil qilgandan keyin yoqing —
  # xato qo'yilsa, muddat tugaguncha orqaga qaytarib bo'lmaydi.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  client_max_body_size 25m;

  # Rasm yuklash uzoq davom etishi mumkin.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # OTP va login — alohida, qattiqroq cheklov.
  location ~ ^/api/(auth|admin/auth)/ {
    limit_req zone=auth_limit burst=10 nodelay;
    proxy_pass http://api_upstream;
  }

  # To'lov webhooklari: provayder javobni 5 soniya kutadi va
  # kechikkanda QAYTA yuboradi — shuning uchun ular cheklanmaydi.
  location ~ ^/api/payments/(click|payme)$ {
    proxy_pass http://api_upstream;
  }

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://api_upstream;
  }

  # Next.js statik fayllari: nomida xesh bor, ya'ni abadiy keshlanadi.
  location /_next/static/ {
    proxy_pass http://web_upstream;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / { proxy_pass http://web_upstream; }
}

# ------------------------------- Admin panel -------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name ALIVER_ADMIN_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/ALIVER_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ALIVER_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Admin panel hech qachon iframe ichida ochilmasligi kerak.
  add_header X-Frame-Options DENY always;
  # Qidiruv tizimlari admin panelni indekslamasin.
  add_header X-Robots-Tag "noindex, nofollow" always;

  client_max_body_size 25m;
  proxy_read_timeout 120s;

  # Admin panelni IP bo'yicha cheklash uchun shu qatorlarni oching:
  # allow 213.230.0.0/16;   # ofis tarmog'i
  # deny all;

  location ~ ^/api/(auth|admin/auth)/ {
    limit_req zone=auth_limit burst=10 nodelay;
    proxy_pass http://api_upstream;
  }

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://api_upstream;
  }

  location /_next/static/ {
    proxy_pass http://admin_upstream;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / { proxy_pass http://admin_upstream; }
}
