# Sertifikat OLINGUNCHA ishlatiladigan vaqtinchalik sozlama.
#
# Certbot HTTP-01 tekshiruvida `/.well-known/acme-challenge/` ni o'qiydi.
# Agar nginx darhol HTTPS ga yo'naltirsa, tekshiruv muvaffaqiyatsiz
# tugaydi va sertifikat berilmaydi — shuning uchun birinchi qadamda
# yo'naltirish YO'Q.

server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 200 'ALIVER.UZ — sertifikat kutilmoqda\n';
    add_header Content-Type text/plain;
  }
}
