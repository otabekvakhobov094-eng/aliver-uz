services:
  api:
    image: ${ALIVER_API_IMAGE:-aliver-api:latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: ${ALIVER_WEB_IMAGE:-aliver-web:latest}
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: ../.env.production
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }

  admin:
    image: ${ALIVER_ADMIN_IMAGE:-aliver-admin:latest}
    build: { context: .., dockerfile: apps/admin/Dockerfile }
    env_file: ../.env.production
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, admin, api]

networks:
  default: { name: aliver-production }
