# ALIVER.UZ — lokal ishlab chiqish muhiti
# Ishga tushirish:  npm run infra:up
services:
  postgres:
    image: postgres:16-alpine
    container_name: aliver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aliver
      POSTGRES_PASSWORD: aliver_dev
      POSTGRES_DB: aliver
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aliver -d aliver']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aliver-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-mos xotira. Prodda Cloudflare R2 / AWS S3 / mahalliy provayder bilan almashtiriladi.
  # DIQQAT: shaxsiy ma'lumot saqlanadigan bucket joylashuvi bo'yicha yurist xulosasi kerak (ekspertiza A-3).
  minio:
    image: minio/minio:latest
    container_name: aliver-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aliver
      MINIO_ROOT_PASSWORD: aliver_dev_secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  mailpit:
    image: axllent/mailpit:latest
    container_name: aliver-mailpit
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  redisdata:
  miniodata:
