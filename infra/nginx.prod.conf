limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
upstream api { server api:4000; }
upstream web { server web:3000; }
upstream admin { server admin:3001; }

server {
  listen 80;
  server_name aliver.uz www.aliver.uz;
  client_max_body_size 25m;
  location /api/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}

server {
  listen 80;
  server_name admin.aliver.uz;
  location /api/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://admin; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
